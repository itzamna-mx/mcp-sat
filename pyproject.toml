[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sat"
version = "0.1.0"
description = "Servidor MCP oficial de Itzamná para datos del SAT: validación de CFDI en vivo, listas negras del Art. 69-B (EFOS) y validación de RFC"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Inaki Sobera", email = "inakisobera8@gmail.com"}
]
keywords = [
    "mcp",
    "mcp-server",
    "sat",
    "cfdi",
    "facturacion",
    "mexico",
    "datos-abiertos",
    "69-b",
    "efos",
    "rfc",
    "ai-agents",
    "claude-desktop",
    "itzamna",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
mcp-sat = "mcp_sat.cli:main"

[project.urls]
Homepage = "https://github.com/itzamna-mx/mcp-sat"
Repository = "https://github.com/itzamna-mx/mcp-sat"
Issues = "https://github.com/itzamna-mx/mcp-sat/issues"

[tool.setuptools.packages.find]
include = ["mcp_sat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
